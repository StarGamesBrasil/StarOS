<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Star Phone OS</title>
<style>
:root{--accent:#6757d9;--bg:#f4f3fb;--card:rgba(255,255,255,.88);--ink:#171725;--muted:#77768b;--line:rgba(40,35,80,.12);--wall:linear-gradient(145deg,#9f8bff,#e6c5ff 48%,#91d9f2)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#171622;color:var(--ink);-webkit-tap-highlight-color:transparent}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:not-allowed}
body{display:flex;justify-content:center;align-items:center;padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}
.phone{width:min(100%,430px);height:min(900px,calc(100dvh - 24px));min-height:560px;border:5px solid #292833;border-radius:42px;overflow:hidden;position:relative;background:var(--bg);box-shadow:0 22px 70px #0008;isolation:isolate}
.status{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;font-weight:700;position:absolute;top:0;left:0;right:0;z-index:20;color:var(--ink);pointer-events:none}.status .right{display:flex;gap:7px;align-items:center}.battery-icon{display:inline-flex;align-items:center;border:1.4px solid currentColor;border-radius:4px;width:20px;height:10px;padding:1px;position:relative}.battery-icon:after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:4px;background:currentColor;border-radius:0 2px 2px 0}.battery-fill{height:100%;background:currentColor;border-radius:2px;width:70%}
.screen{position:absolute;inset:0;overflow:auto;padding:42px 16px 26px;background:var(--wall);background-size:cover;background-position:center;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.home-top{display:flex;justify-content:space-between;align-items:center;margin:9px 4px 18px;color:#fff;text-shadow:0 1px 8px #0003}.greeting{font-size:14px;opacity:.9}.bigtime{font-size:40px;font-weight:750;letter-spacing:-2px}.weather-pill{background:#ffffff35;border:1px solid #ffffff40;padding:9px 11px;border-radius:18px;color:white;font-size:12px;backdrop-filter:blur(14px)}
.searchbar{display:flex;gap:9px;align-items:center;background:#ffffffc9;border-radius:17px;padding:12px 14px;margin:0 2px 22px;color:#68657d;font-size:13px}
.app-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px 8px;padding:0 2px}.app-icon{display:flex;flex-direction:column;align-items:center;gap:7px;background:transparent;color:white;text-shadow:0 1px 5px #0005;min-width:0}.app-icon .glyph{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:27px;box-shadow:0 6px 18px #2222;border:1px solid #ffffff50;background:linear-gradient(145deg,#ffffffec,#ffffffb9);text-shadow:none}.app-icon span:last-child{font-size:11px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.dock{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:12px;margin:25px 0 12px;background:#ffffff45;border:1px solid #ffffff40;border-radius:25px;backdrop-filter:blur(18px)}.dock .app-icon .glyph{width:51px;height:51px}.page-dots{text-align:center;color:#fff9;font-size:12px}
.navline{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:112px;height:4px;border-radius:9px;background:var(--ink);opacity:.55;z-index:50}.appview{position:absolute;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column;animation:pop .18s ease-out}.appview.show{display:flex}@keyframes pop{from{opacity:.6;transform:scale(.98)}to{opacity:1;transform:scale(1)}}.apphead{padding:44px 18px 12px;display:flex;align-items:center;gap:12px;background:var(--bg);position:relative;z-index:2}.back{background:#e8e6f4;color:var(--accent);border-radius:13px;width:38px;height:38px;font-size:20px}.apphead h2{font-size:22px;margin:0;flex:1;letter-spacing:-.5px}.appbody{padding:8px 16px 32px;overflow:auto;flex:1;overscroll-behavior:contain}.card{background:var(--card);border:1px solid var(--line);border-radius:21px;padding:16px;margin-bottom:12px;box-shadow:0 5px 18px #17173308}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:var(--muted);font-size:12px}.small{font-size:13px}.title{font-weight:750;font-size:16px;margin:0 0 10px}.btn{padding:11px 14px;border-radius:13px;background:var(--accent);color:#fff;font-weight:650;font-size:13px}.btn.secondary{background:#e9e7f7;color:var(--accent)}.btn.danger{background:#ffe6e7;color:#b82939}.btn.full{width:100%}.btn.ghost{background:transparent;color:var(--accent);padding:8px}.input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;color:var(--ink);outline-color:var(--accent);margin:5px 0 10px}textarea{min-height:100px;resize:vertical}.label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-top:8px}.progress{height:9px;border-radius:20px;background:#e7e5ef;overflow:hidden;margin:9px 0}.progress>i{display:block;height:100%;width:0;background:var(--accent);border-radius:20px;transition:width .2s}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f1effb;border-radius:15px;padding:13px}.stat strong{display:block;font-size:21px}.stat span{font-size:11px;color:var(--muted)}.listitem{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border-bottom:0}.miniicon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#ece9fc;font-size:22px;flex-shrink:0}.listitem .desc{flex:1;min-width:0}.listitem .desc strong{display:block;font-size:13px}.listitem .desc small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.switch{width:44px;height:26px;border-radius:20px;background:#d4d1e1;padding:3px;display:inline-flex;align-items:center}.switch:before{content:"";width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #0002;transition:transform .15s}.switch.on{background:var(--accent)}.switch.on:before{transform:translateX(18px)}
.lock{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;background:var(--wall);background-size:cover;color:white;text-align:center}.lock.show{display:flex}.locktime{font-size:64px;letter-spacing:-3px;font-weight:300}.lockdate{font-size:15px;margin-bottom:35px}.lockbox{background:#ffffff25;border:1px solid #ffffff55;backdrop-filter:blur(18px);padding:20px;border-radius:25px;width:100%;max-width:300px}.lockbox input{background:#ffffffdf;text-align:center;letter-spacing:7px}.toast{position:absolute;z-index:60;bottom:35px;left:14px;right:14px;background:#22212cf0;color:#fff;padding:13px 16px;border-radius:15px;font-size:13px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateY(0)}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.photo{aspect-ratio:1;object-fit:cover;width:100%;border-radius:10px;background:#e5e2ef}.wall-option{height:70px;border-radius:13px;border:3px solid transparent}.wall-option.selected{border-color:var(--accent)}.wallrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.phonepreview{background:#262530;border-radius:25px;padding:8px;color:#fff}.phonepreview .previewwall{height:150px;border-radius:19px;display:grid;place-items:center;font-size:30px}.gamecanvas{width:100%;background:#171725;border-radius:15px;display:block;touch-action:manipulation}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keypad button{padding:16px;border-radius:16px;background:#eeecf8;font-size:20px}.hidden{display:none!important}
@media(max-height:650px){.phone{height:calc(100dvh - 12px);min-height:0;border-radius:30px}.apphead{padding-top:38px}.screen{padding-top:38px}.app-grid{gap:13px 8px}.app-icon .glyph{width:48px;height:48px}.bigtime{font-size:34px}}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="status"><span id="statusTime">9:41</span><span class="right"><span id="wifiStatus">◉</span><span id="signalStatus">▮▮▮</span><span id="batteryText">100%</span><span class="battery-icon"><i class="battery-fill" id="batteryFill"></i></span></span></div>
  <main class="screen" id="homeScreen">
    <div class="home-top"><div><div class="greeting">STAR PHONE OS</div><div class="bigtime" id="homeTime">9:41</div><div id="homeDate" class="small">domingo, 11 de outubro</div></div><div class="weather-pill">☀️ 24°<br><span style="opacity:.8">Demonstração</span></div></div>
    <div class="searchbar" onclick="openApp('store')">⌕ <span>Pesquisar aplicativos e jogos</span></div>
    <div class="app-grid" id="appGrid"></div>
    <div class="dock" id="dock"></div>
    <div class="page-dots">● ○ ○</div>
  </main>
  <section class="appview" id="appView"><header class="apphead"><button class="back" onclick="closeApp()" aria-label="Voltar">‹</button><h2 id="appTitle">Aplicativo</h2><button class="btn ghost" id="headAction" style="display:none"></button></header><div class="appbody" id="appBody"></div></section>
  <section class="lock" id="lockScreen"><div style="font-size:12px;letter-spacing:3px;margin-bottom:16px">STAR PHONE OS</div><div class="locktime" id="lockTime">9:41</div><div class="lockdate" id="lockDate"></div><div class="lockbox"><div id="lockMessage">Celular bloqueado</div><input id="unlockPin" class="input" inputmode="numeric" type="password" maxlength="12" placeholder="Senha" style="margin-top:15px"><button class="btn full" onclick="unlockPhone()">Desbloquear</button><button class="btn ghost" onclick="showCharging()" style="color:white">Bateria / carregar</button></div></section>
  <div class="toast" id="toast"></div><div class="navline" onclick="closeApp()"></div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const DEFAULT_APPS=[
{id:'camera',name:'Câmera',icon:'📷',size:90,kind:'system',color:'#f4c7a1'},
{id:'gallery',name:'Galeria',icon:'🌄',size:70,kind:'system'},
{id:'files',name:'Arquivos',icon:'📁',size:45,kind:'system'},
{id:'settings',name:'Configurações',icon:'⚙️',size:55,kind:'system'},
{id:'store',name:'Star Store',icon:'🛍️',size:65,kind:'system'},
{id:'bank',name:'Star Bank',icon:'🏦',size:50,kind:'system'},
{id:'games',name:'Game Center',icon:'🎮',size:80,kind:'system'},
{id:'studio',name:'Game Studio',icon:'🧩',size:100,kind:'system'},
{id:'notes',name:'Notas',icon:'📝',size:25,kind:'system'},
{id:'calculator',name:'Calculadora',icon:'🧮',size:20,kind:'system'},
{id:'clock',name:'Relógio',icon:'⏰',size:25,kind:'system'},
{id:'messages',name:'Mensagens',icon:'💬',size:35,kind:'system'}
];
const MODELS=[
{id:'mini',name:'Star Mini',price:500,storage:32,ram:2,battery:2500,mp:5,cpu:1,charge:5,screen:'HD',hz:60,desc:'Básico para tarefas diárias.'},
{id:'lite',name:'Star Lite',price:1200,storage:64,ram:4,battery:3500,mp:12,cpu:2,charge:10,screen:'Full HD',hz:60,desc:'Equilíbrio entre autonomia e velocidade.'},
{id:'pro',name:'Star Pro',price:3500,storage:256,ram:8,battery:5000,mp:48,cpu:4,charge:25,screen:'Full HD+',hz:120,desc:'Desempenho avançado e câmera de alta resolução.'},
{id:'ultra',name:'Star Ultra',price:7000,storage:512,ram:16,battery:6000,mp:108,cpu:6,charge:45,screen:'QHD+',hz:120,desc:'Experiência premium para jogos e fotografia.'},
{id:'titan',name:'Star Titan',price:15000,storage:1024,ram:24,battery:7000,mp:108,cpu:8,charge:65,screen:'QHD+ OLED',hz:144,desc:'O topo da linha Star.'}
];
const WALLS=[
'linear-gradient(145deg,#8378ff,#eac8ff 50%,#8bdaf2)',
'linear-gradient(145deg,#ff9a9e,#fad0c4 55%,#fbc2eb)',
'linear-gradient(145deg,#064e3b,#34d399 55%,#a7f3d0)',
'linear-gradient(145deg,#111827,#4338ca 55%,#c4b5fd)',
'linear-gradient(145deg,#f97316,#facc15 50%,#fda4af)',
'linear-gradient(145deg,#0f172a,#334155 50%,#94a3b8)'
];
const APP_STORE=[
{id:'race',name:'Star Racer',icon:'🏎️',size:120,price:100,ram:2,cpu:1,desc:'Desvie dos obstáculos e marque pontos.',type:'game'},
{id:'memory',name:'Memória Mágica',icon:'🃏',size:45,price:0,ram:1,cpu:1,desc:'Encontre os pares de cartas.',type:'game'},
{id:'quiz',name:'Quiz Star',icon:'🧠',size:35,price:0,ram:1,cpu:1,desc:'Responda perguntas e some pontos.',type:'game'},
{id:'paint',name:'Star Paint',icon:'🎨',size:75,price:80,ram:2,cpu:2,desc:'Um pequeno espaço para desenhar.',type:'tool'},
{id:'calendar',name:'Calendário',icon:'🗓️',size:30,price:0,ram:1,cpu:1,desc:'Datas e lembretes locais.',type:'tool'},
{id:'music',name:'Música',icon:'🎵',size:40,price:0,ram:1,cpu:1,desc:'Reproduza áudio escolhido no aparelho.',type:'tool'}
];
const DB_NAME='star-phone-os-db', DB_VERSION=1;
let db=null, state=null, activeApp=null, toastTimer=null, tickTimer=null, chargeTimer=null, gameLoop=null, cameraStream=null, cameraFacing='environment', mediaRecorder=null, recordedChunks=[], calcExpr='', timerStart=null;
const initialState=()=>({
version:1,model:'mini',owned:['mini'],coins:1800,balance:1800,transactions:[],battery:100,charging:false,locked:false,pin:'',theme:'light',accent:'#6757d9',wall:0,customWall:'',brightness:100,airplane:false,wifi:true,powerSave:false,volume:70,
apps:DEFAULT_APPS.map(a=>({...a,installed:true})),photos:[],notes:[],contacts:[{name:'Star Assistente',phone:'100'}],messages:[{from:'Star Assistente',text:'Bem-vindo ao Star Phone OS! Explore seu novo celular. 🙂',time:Date.now()}],events:[],projects:[],achievements:[],history:[],usage:{},trash:[],bankGoals:[],chargeStarted:null,chargeFrom:0,chargeTarget:100,lastSeen:Date.now(),calls:[],alarm:null
});
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){resolve(null);return}let req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{let d=req.result;if(!d.objectStoreNames.contains('data'))d.createObjectStore('data')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function dbGet(key){return new Promise((resolve,reject)=>{if(!db){resolve(null);return}let r=db.transaction('data','readonly').objectStore('data').get(key);r.onsuccess=()=>resolve(r.result??null);r.onerror=()=>reject(r.error)})}
function dbSet(key,val){return new Promise((resolve,reject)=>{if(!db){resolve(false);return}let tx=db.transaction('data','readwrite');tx.objectStore('data').put(val,key);tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error)})}
async function save(){state.lastSeen=Date.now();try{localStorage.setItem('starPhoneMeta',JSON.stringify({...state,photos:[]}));await dbSet('state',state)}catch(e){notify('Não foi possível salvar tudo: armazenamento do navegador limitado.')} }
async function load(){try{db=await openDB();let saved=await dbGet('state');if(!saved){let local=localStorage.getItem('starPhoneMeta');if(local){try{saved=JSON.parse(local)}catch{}}}state=saved?{...initialState(),...saved}:initialState();state.apps=state.apps||DEFAULT_APPS.map(a=>({...a,installed:true}));for(const a of DEFAULT_APPS)if(!state.apps.some(x=>x.id===a.id))state.apps.push({...a,installed:true});state.photos=state.photos||[];state.projects=state.projects||[];state.transactions=state.transactions||[];state.usage=state.usage||{};state.owned=state.owned||['mini'];state.model=state.model||'mini';if(state.charging&&state.chargeStarted){let elapsed=(Date.now()-state.chargeStarted)/1000;state.battery=Math.min(state.chargeTarget||100,state.battery+elapsed*chargeRate()/3600);state.chargeStarted=Date.now()}else{let elapsed=Math.max(0,(Date.now()-(state.lastSeen||Date.now()))/1000);state.battery=Math.max(0,state.battery-elapsed*idleDrain()/3600)}applyTheme();renderHome();updateStatus();if(state.battery<=0)showCharging();}catch(e){state=initialState();renderHome();notify('Modo temporário: não foi possível abrir o armazenamento persistente.')} }
function model(){return MODELS.find(m=>m.id===state.model)||MODELS[0]}
function usedStorage(){let appSize=state.apps.filter(a=>a.installed).reduce((s,a)=>s+(a.size||0),0);let photoSize=state.photos.reduce((s,p)=>s+(p.sizeKB||0),0)/1024;let noteSize=state.notes.reduce((s,n)=>s+(new Blob([n.title||'',n.body||'']).size/1024),0)/1024;let projectSize=state.projects.reduce((s,p)=>s+(p.sizeKB||20),0)/1024;return appSize+photoSize+noteSize+projectSize+2}
function freeStorage(){return Math.max(0,model().storage*1024-usedStorage())}
function batteryDrain(){let base=state.brightness/100*.65+(state.wifi?.13:.04)+(state.powerSave?-.18:0);let app=activeApp?(({camera:2.4,games:2,studio:1.5,gallery:.7,store:.5})[activeApp]||.35):.08;return Math.max(.08,base+app)*(3500/model().battery)}
function idleDrain(){return state.powerSave?.25:.7}
function chargeRate(){return model().charge*1000/Math.max(1,model().battery)*18}
function fmtSize(kb){return kb>=1024?(kb/1024).toFixed(2)+' GB':Math.max(1,Math.round(kb))+' MB'}
function fmtGB(kb){return (kb/1024).toFixed(2)+' GB'}
function notify(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}
function applyTheme(){if(!state)return;document.documentElement.style.setProperty('--accent',state.accent||'#6757d9');document.documentElement.style.setProperty('--bg',state.theme==='dark'?'#171622':'#f4f3fb');document.documentElement.style.setProperty('--card',state.theme==='dark'?'rgba(42,40,57,.94)':'rgba(255,255,255,.88)');document.documentElement.style.setProperty('--ink',state.theme==='dark'?'#f4f2ff':'#171725');document.documentElement.style.setProperty('--muted',state.theme==='dark'?'#aaa6c2':'#77768b');document.documentElement.style.setProperty('--line',state.theme==='dark'?'rgba(255,255,255,.1)':'rgba(40,35,80,.12)');let wall=state.customWall?`url("${state.customWall}")`:WALLS[state.wall||0];$('homeScreen').style.background=wall;$('lockScreen').style.background=wall;$('homeScreen').style.filter=`brightness(${.55+state.brightness/220})`; }
function timeString(){return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function updateStatus(){if(!state)return;let m=model();$('statusTime').textContent=timeString();$('homeTime').textContent=timeString();$('homeDate').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});$('lockTime').textContent=timeString();$('lockDate').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});$('batteryText').textContent=Math.floor(state.battery)+'%';$('batteryFill').style.width=state.battery+'%';$('wifiStatus').textContent=state.airplane?'✈':state.wifi?'⌁':'×';$('signalStatus').textContent=state.airplane?'':'▮▮▮';if(state.battery<=20&&!state.lowWarned){state.lowWarned=true;notify('Bateria fraca. Conecte o carregador.')}if(state.battery>22)state.lowWarned=false;applyTheme()}
function iconFor(id){return state.apps.find(a=>a.id===id)?.icon||APP_STORE.find(a=>a.id===id)?.icon||'📦'}
function renderHome(){if(!state)return;let apps=state.apps.filter(a=>a.installed);let grid=$('appGrid'),dock=$('dock');grid.innerHTML='';dock.innerHTML='';let dockIds=['messages','camera','gallery','settings'];apps.filter(a=>!dockIds.includes(a.id)).forEach(a=>grid.appendChild(appButton(a)));dockIds.forEach(id=>{let a=apps.find(x=>x.id===id);if(a)dock.appendChild(appButton(a))});}
function appButton(a){let b=document.createElement('button');b.className='app-icon';b.innerHTML=`<span class="glyph">${a.icon}</span><span>${escapeHTML(a.name)}</span>`;b.onclick=()=>openApp(a.id);return b}
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openApp(id){if(state.battery<=0){showCharging();return}if(state.locked){showLock();return}let app=state.apps.find(a=>a.id===id);if(!app||!app.installed){notify('Este aplicativo não está instalado.');return}let delay=Math.max(100,800/model().cpu+(model().ram<4?300:0)+(freeStorage()<model().storage*100?.2*1000:0));if(activeApp&&activeApp!==id){state.history.push(activeApp);if(state.history.length>10)state.history.shift()}activeApp=id;renderApp(id,delay);save();updateStatus()}
function closeApp(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}if(mediaRecorder&&mediaRecorder.state!=='inactive'){try{mediaRecorder.stop()}catch{}}if(gameLoop){cancelAnimationFrame(gameLoop);gameLoop=null}activeApp=null;$('appView').classList.remove('show');$('homeScreen').style.display='block';$('appBody').innerHTML='';renderHome();updateStatus();save()}
function renderApp(id,delay=0){$('homeScreen').style.display='block';$('appTitle').textContent=(state.apps.find(a=>a.id===id)||APP_STORE.find(a=>a.id===id)||{name:id}).name;$('headAction').style.display='none';$('appBody').innerHTML='<div class="card" style="text-align:center;padding:28px"><div style="font-size:28px">✨</div><div class="muted">Abrindo aplicativo…</div><div class="progress"><i id="loadingBar"></i></div></div>';$('appView').classList.add('show');setTimeout(()=>{if(activeApp!==id)return;$('appBody').innerHTML='';const renderers={camera:renderCamera,gallery:renderGallery,files:renderFiles,settings:renderSettings,store:renderStore,bank:renderBank,games:renderGames,studio:renderStudio,notes:renderNotes,calculator:renderCalculator,clock:renderClock,messages:renderMessages,contacts:renderContacts,phone:renderPhone,calendar:renderCalendar,music:renderMusic,quiz:()=>renderInstalledGame('quiz'),memory:()=>renderInstalledGame('memory'),race:()=>renderInstalledGame('race'),paint:renderPaint};(renderers[id]||(()=>renderGeneric(id)))();updateStatus()},Math.min(1800,delay))}
function appHeaderAction(label,fn){let b=$('headAction');b.style.display='block';b.textContent=label;b.onclick=fn}
function renderCamera(){let b=$('appBody');b.innerHTML=`<div class="card"><div class="row"><div><div class="title">Câmera Star</div><div class="muted">${model().mp} MP simulados · ${model().name}</div></div><span style="font-size:28px">📸</span></div><video id="cameraVideo" autoplay playsinline muted style="display:none;width:100%;border-radius:16px;background:#15141e;aspect-ratio:3/4;object-fit:cover"></video><canvas id="cameraCanvas" width="720" height="960" style="width:100%;border-radius:16px;background:linear-gradient(145deg,#423f66,#d8c5ff 50%,#8ed6e6);aspect-ratio:3/4;display:block"></canvas><div class="muted" id="cameraStatus" style="margin-top:9px">Modo de demonstração. Permita acesso para usar a câmera real.</div><div class="row" style="margin-top:14px"><button class="btn secondary" onclick="startCamera()">Ativar câmera</button><button class="btn secondary" onclick="switchCamera()">Virar câmera</button></div><div class="row" style="margin-top:9px"><label class="small">Zoom <input id="zoomRange" type="range" min="1" max="3" step=".1" value="1" style="width:105px;vertical-align:middle" oninput="applyZoom(this.value)"></label><label class="small">Temporizador <select id="camTimer" style="width:80px;margin:0;padding:6px"><option value="0">Off</option><option value="3">3 s</option><option value="5">5 s</option></select></label></div><button class="btn full" style="margin-top:15px" onclick="takePhoto()">● Tirar foto</button><div class="muted" style="margin-top:10px">A resolução e o tamanho do arquivo variam conforme o aparelho virtual. O navegador pode limitar o acesso à câmera.</div></div>`;
drawDemoCamera()}
function drawDemoCamera(){let c=$('cameraCanvas');if(!c)return;let x=c.getContext('2d'),g=x.createLinearGradient(0,0,c.width,c.height);g.addColorStop(0,'#423f66');g.addColorStop(.5,'#b5a6f8');g.addColorStop(1,'#8ed6e6');x.fillStyle=g;x.fillRect(0,0,c.width,c.height);x.fillStyle='#ffffff28';for(let i=0;i<7;i++){x.beginPath();x.arc(90+i*95,180+(i%3)*120,40+(i%2)*18,0,Math.PI*2);x.fill()}x.fillStyle='#f8f5ff';x.font='bold 36px sans-serif';x.textAlign='center';x.fillText('STAR CAMERA',c.width/2,c.height-80);x.font='20px sans-serif';x.fillText('Modo de demonstração',c.width/2,c.height-45)}
async function startCamera(){if(!navigator.mediaDevices?.getUserMedia){notify('Este navegador não oferece acesso à câmera aqui.');return}try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:cameraFacing},audio:false});let v=$('cameraVideo');v.srcObject=cameraStream;v.style.display='block';$('cameraCanvas').style.display='none';$('cameraStatus').textContent='Câmera real ativa. Toque em Tirar foto para capturar.';notify('Câmera ativada.')}catch(e){notify('Não foi possível acessar a câmera. Verifique a permissão e HTTPS.');$('cameraStatus').textContent='Câmera indisponível; usando demonstração.'}}
async function switchCamera(){cameraFacing=cameraFacing==='environment'?'user':'environment';if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;await startCamera()}else notify('Câmera selecionada: '+(cameraFacing==='user'?'frontal':'traseira'))}
function applyZoom(v){let el=$('cameraVideo');if(el)el.style.transform=`scale(${v})`}
async function takePhoto(){let secs=Number($('camTimer')?.value||0);if(secs){notify(`Foto em ${secs} segundos…`);await new Promise(r=>setTimeout(r,secs*1000));if(activeApp!=='camera')return}if(freeStorage()<.2){notify('Armazenamento cheio. Apague arquivos antes de fotografar.');return}let c=document.createElement('canvas'),w=[720,1200,2000,2800][Math.min(3,Math.floor(model().mp/30))],h=Math.round(w*4/3);c.width=w;c.height=h;let ctx=c.getContext('2d');if(cameraStream&&$('cameraVideo')?.videoWidth){ctx.drawImage($('cameraVideo'),0,0,w,h)}else{let src=$('cameraCanvas');if(src)ctx.drawImage(src,0,0,w,h);else{ctx.fillStyle='#a99bed';ctx.fillRect(0,0,w,h)}}let quality=model().mp>=48?.92:.72;let blob=await new Promise(resolve=>c.toBlob(resolve,'image/jpeg',quality));if(!blob){notify('Falha ao criar a foto.');return}let photo={id:'p'+Date.now()+Math.random().toString(16).slice(2),name:'IMG_'+new Date().toISOString().replace(/[-:TZ.]/g,'').slice(0,14)+'.jpg',date:Date.now(),sizeKB:blob.size/1024,favorite:false,mime:'image/jpeg',blob};try{await dbSet('photo:'+photo.id,blob);photo.blobRef='photo:'+photo.id;state.photos.unshift({...photo,blob:undefined});await save();notify('Foto salva na galeria! ('+Math.round(photo.sizeKB)+' KB)');renderCamera()}catch(e){notify('Não foi possível salvar a foto. Verifique o espaço disponível.')} }
async function getPhotoURL(p){if(p.blob)return URL.createObjectURL(p.blob);let blob=p.blobRef?await dbGet(p.blobRef):null;if(blob)return URL.createObjectURL(blob);return null}
async function renderGallery(){let b=$('appBody');b.innerHTML=`<div class="card"><div class="row"><div><div class="title">Suas fotos</div><div class="muted">${state.photos.length} itens · ${fmtGB(state.photos.reduce((s,p)=>s+p.sizeKB,0)/1024)} usados</div></div><button class="btn secondary" onclick="importPhoto()">＋ Importar</button></div><label class="label">Pesquisar</label><input class="input" id="gallerySearch" placeholder="Nome do arquivo" oninput="filterGallery()"><div class="gallery" id="galleryGrid"></div><div class="muted" id="galleryEmpty" style="text-align:center;padding:20px">Nenhuma foto ainda. Abra a Câmera para tirar uma.</div></div>`;await fillGallery()}
async function fillGallery(){let grid=$('galleryGrid');if(!grid)return;grid.innerHTML='';$('galleryEmpty').style.display=state.photos.length?'none':'block';for(const p of state.photos){let url=await getPhotoURL(p);let wrap=document.createElement('div');wrap.style.position='relative';wrap.dataset.name=p.name.toLowerCase();let img=document.createElement('img');img.className='photo';img.alt=p.name;img.src=url||'';img.onclick=()=>viewPhoto(p.id);wrap.appendChild(img);if(p.favorite){let f=document.createElement('span');f.textContent='♥';f.style.cssText='position:absolute;right:5px;top:4px;color:white;text-shadow:0 1px 4px #000';wrap.appendChild(f)}grid.appendChild(wrap)}}
function filterGallery(){let q=$('gallerySearch').value.toLowerCase();document.querySelectorAll('#galleryGrid>div').forEach(e=>e.style.display=e.dataset.name.includes(q)?'':'none')}
async function viewPhoto(id){let p=state.photos.find(x=>x.id===id);if(!p)return;let url=await getPhotoURL(p);let body=$('appBody');body.innerHTML=`<div class="card"><button class="btn secondary" onclick="renderGallery()">‹ Galeria</button><img src="${url||''}" style="width:100%;max-height:55vh;object-fit:contain;border-radius:15px;margin-top:12px;background:#ddd"><div class="title" style="margin-top:12px">${escapeHTML(p.name)}</div><div class="muted">${new Date(p.date).toLocaleString('pt-BR')} · ${Math.round(p.sizeKB)} KB</div><div class="row" style="margin-top:15px"><button class="btn secondary" onclick="toggleFavorite('${p.id}')">${p.favorite?'♥ Favorita':'♡ Favoritar'}</button><button class="btn secondary" onclick="downloadPhoto('${p.id}')">Baixar</button><button class="btn danger" onclick="deletePhoto('${p.id}')">Excluir</button></div></div>`}
async function toggleFavorite(id){let p=state.photos.find(x=>x.id===id);if(p){p.favorite=!p.favorite;await save();viewPhoto(id)}}
async function deletePhoto(id){let p=state.photos.find(x=>x.id===id);if(!p)return;if(!confirm('Excluir esta foto permanentemente?'))return;if(p.blobRef)try{await new Promise(resolve=>{let tx=db.transaction('data','readwrite');tx.objectStore('data').delete(p.blobRef);tx.oncomplete=resolve;tx.onerror=resolve})}catch{}state.photos=state.photos.filter(x=>x.id!==id);await save();notify('Foto excluída.');renderGallery()}
async function downloadPhoto(id){let p=state.photos.find(x=>x.id===id);if(!p)return;let blob=p.blob||(p.blobRef?await dbGet(p.blobRef):null);if(!blob){notify('Arquivo não encontrado.');return}let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=p.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
async function importPhoto(){let input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=async()=>{let f=input.files?.[0];if(!f)return;if(f.size/1024>freeStorage()*1024){notify('Não há espaço suficiente.');return}let id='p'+Date.now(),p={id,name:f.name,date:Date.now(),sizeKB:f.size/1024,favorite:false,mime:f.type,blobRef:'photo:'+id};try{await dbSet(p.blobRef,f);state.photos.unshift(p);await save();renderGallery();notify('Imagem importada.')}catch{notify('Falha ao importar.')}};input.click()}
function renderFiles(){let used=usedStorage(),total=model().storage*1024,apps=state.apps.filter(a=>a.installed);$('appBody').innerHTML=`<div class="card"><div class="title">Armazenamento interno</div><div class="row"><strong>${fmtGB(used/1024)} usados</strong><span class="muted">${model().storage>=1024?(model().storage/1024)+' TB':model().storage+' GB'} no total</span></div><div class="progress"><i style="width:${Math.min(100,used/total*100)}%"></i></div><div class="muted">${fmtGB(Math.max(0,total-used)/1024)} disponíveis</div></div><div class="card"><div class="title">Uso por categoria</div>${storageRow('Aplicativos',apps.reduce((s,a)=>s+a.size,0),'#6757d9')}${storageRow('Fotos e vídeos',state.photos.reduce((s,p)=>s+p.sizeKB,0)/1024,'#e78ba8')}${storageRow('Notas e projetos',used-apps.reduce((s,a)=>s+a.size,0)-state.photos.reduce((s,p)=>s+p.sizeKB,0)/1024,'#61b6a6')}<div class="muted">O sistema reserva cerca de 2 MB. Os tamanhos são unidades simuladas para o jogo.</div></div><div class="card"><div class="title">Aplicativos instalados</div>${apps.map(a=>`<div class="listitem"><div class="miniicon">${a.icon}</div><div class="desc"><strong>${escapeHTML(a.name)}</strong><small>${a.size} MB · ${a.kind==='system'?'Sistema':'Instalado'}</small></div>${a.kind==='system'?'<span class="muted">Sistema</span>':`<button class="btn danger" onclick="uninstallApp('${a.id}')">Remover</button>`}</div>`).join('')}</div><div class="card"><div class="title">Arquivos pessoais</div><div class="listitem"><div class="miniicon">🌄</div><div class="desc"><strong>Galeria</strong><small>${state.photos.length} arquivos</small></div><button class="btn secondary" onclick="openApp('gallery')">Abrir</button></div><div class="listitem"><div class="miniicon">📝</div><div class="desc"><strong>Notas</strong><small>${state.notes.length} notas</small></div><button class="btn secondary" onclick="openApp('notes')">Abrir</button></div><button class="btn secondary full" onclick="clearCache()">Limpar cache simulado (10 MB)</button></div>`}
function storageRow(name,size,color){return `<div class="row small" style="margin-top:12px"><span>${name}</span><strong>${fmtSize(size)}</strong></div><div class="progress"><i style="width:${Math.min(100,size/(model().storage*1024)*100)}%;background:${color}"></i></div>`}
function renderSettings(){let s=state;$('appBody').innerHTML=`<div class="card"><div class="title">Personalização</div><label class="label">Cor do sistema</label><div class="row" style="flex-wrap:wrap;justify-content:flex-start">${['#6757d9','#2878e5','#17a673','#df4966','#ed65ad','#20202b','#f0f0f4'].map(c=>`<button aria-label="Cor ${c}" onclick="setAccent('${c}')" style="width:34px;height:34px;border-radius:50%;background:${c};border:3px solid ${s.accent===c?'#aaa':'transparent'}"></button>`).join('')}</div><label class="label">Tema</label><select class="input" onchange="setTheme(this.value)"><option value="light" ${s.theme==='light'?'selected':''}>Claro</option><option value="dark" ${s.theme==='dark'?'selected':''}>Escuro</option></select><div class="title" style="margin-top:12px">Papel de parede</div><div class="wallrow">${WALLS.map((w,i)=>`<button class="wall-option ${!s.customWall&&s.wall===i?'selected':''}" style="background:${w}" onclick="setWall(${i})"></button>`).join('')}</div><button class="btn secondary full" style="margin-top:10px" onclick="importWallpaper()">Importar imagem do aparelho</button></div><div class="card"><div class="title">Bateria e conectividade</div><div class="row"><span>Economia de bateria</span><button class="switch ${s.powerSave?'on':''}" onclick="toggleSetting('powerSave')"></button></div><div class="row" style="margin-top:14px"><span>Wi-Fi simulado</span><button class="switch ${s.wifi?'on':''}" onclick="toggleSetting('wifi')"></button></div><div class="row" style="margin-top:14px"><span>Modo avião</span><button class="switch ${s.airplane?'on':''}" onclick="toggleSetting('airplane')"></button></div><label class="label">Brilho · ${s.brightness}%</label><input type="range" min="25" max="100" value="${s.brightness}" oninput="setBrightness(this.value)" style="width:100%"><div class="row" style="margin-top:10px"><span>Volume simulado</span><strong>${s.volume}%</strong></div><input type="range" min="0" max="100" value="${s.volume}" oninput="state.volume=+this.value;this.previousElementSibling.querySelector('strong').textContent=this.value+'%';save()" style="width:100%"></div><div class="card"><div class="title">Segurança</div><div class="muted">A senha é protegida por hash no armazenamento local; não é uma proteção de segurança para dados reais.</div><label class="label">Definir nova senha numérica (4 a 12 dígitos)</label><input class="input" id="newPin" inputmode="numeric" maxlength="12" type="password" placeholder="${s.pin?'Senha configurada':'Criar senha'}"><button class="btn full" onclick="setPin()">Salvar senha</button><button class="btn secondary full" style="margin-top:8px" onclick="lockPhone()">Bloquear celular agora</button><button class="btn danger full" style="margin-top:8px" onclick="factoryReset()">Redefinir de fábrica</button></div><div class="card"><div class="title">Sobre este aparelho</div><div class="listitem"><div class="desc"><strong>${model().name}</strong><small>Star Phone OS 1.0 · ${model().ram} GB RAM · ${model().storage} GB</small></div></div><div class="listitem"><div class="desc"><strong>Processador virtual</strong><small>Nível ${model().cpu} · ${model().hz} Hz · tela ${model().screen}</small></div></div><button class="btn secondary full" onclick="exportBackup()">Exportar backup JSON</button><button class="btn secondary full" style="margin-top:8px" onclick="importBackup()">Importar backup JSON</button></div>`}
function setAccent(c){state.accent=c;applyTheme();save();renderSettings()}
function setTheme(t){state.theme=t;applyTheme();save();renderSettings()}
function setWall(i){state.wall=i;state.customWall='';applyTheme();save();renderSettings()}
function importWallpaper(){let input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=()=>{let f=input.files?.[0];if(!f)return;if(f.size>5*1024*1024){notify('Escolha uma imagem de até 5 MB.');return}let r=new FileReader();r.onload=()=>{state.customWall=r.result;applyTheme();save();renderSettings()};r.readAsDataURL(f)};input.click()}
function setBrightness(v){state.brightness=+v;applyTheme();save()}
function toggleSetting(k){state[k]=!state[k];if(k==='airplane'&&state.airplane)state.wifi=false;applyTheme();save();renderSettings();updateStatus()}
async function hashPin(pin){if(crypto?.subtle){let data=new TextEncoder().encode(pin),hash=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('')}return pin}
async function setPin(){let p=$('newPin').value;if(p&&!/^\d{4,12}$/.test(p)){notify('Use de 4 a 12 números.');return}state.pin=p?await hashPin(p):'';await save();notify(p?'Senha configurada.':'Senha removida.');renderSettings()}
function lockPhone(){state.locked=true;save();showLock()}
function showLock(){$('lockScreen').classList.add('show');$('unlockPin').value='';$('lockMessage').textContent=state.pin?'Digite sua senha para desbloquear':'Toque em desbloquear para continuar'}
async function unlockPhone(){if(state.pin){let h=await hashPin($('unlockPin').value);if(h!==state.pin){$('lockMessage').textContent='Senha incorreta. Tente novamente.';return}}state.locked=false;$('lockScreen').classList.remove('show');save();notify('Celular desbloqueado.')}
function showCharging(){activeApp=null;$('appView').classList.remove('show');$('homeScreen').style.display='none';$('lockScreen').classList.add('show');$('lockMessage').innerHTML=`Bateria: <strong id="chargePercent">${Math.floor(state.battery)}%</strong><div class="progress"><i id="chargeBar" style="width:${state.battery}%"></i></div><div class="muted" style="color:white">Conecte o carregador virtual para ligar o aparelho.</div><button class="btn full" style="margin-top:12px" onclick="connectCharger()">⚡ Conectar carregador</button>`;$('unlockPin').style.display='none';document.querySelector('#lockScreen .lockbox>button').style.display='none'}
function connectCharger(){state.charging=true;state.chargeStarted=Date.now();state.chargeTarget=100;$('unlockPin').style.display='block';$('lockScreen').classList.add('show');$('lockMessage').innerHTML=`Carregando… <strong id="chargePercent">${Math.floor(state.battery)}%</strong><div class="progress"><i id="chargeBar" style="width:${state.battery}%"></i></div><div class="muted" style="color:white">Potência virtual: ${model().charge} W</div><button class="btn full" style="margin-top:12px" onclick="bootPhone()">Ligar celular</button>`;save();notify('Carregador conectado.')}
function bootPhone(){if(state.battery<3){notify('Aguarde a bateria chegar a 3%.');return}state.charging=false;state.locked=false;$('lockScreen').classList.remove('show');$('unlockPin').style.display='block';$('lockScreen').querySelector('.lockbox>button').style.display='';$('homeScreen').style.display='block';save();notify('Star Phone OS iniciado.')}
function factoryReset(){if(!confirm('Apagar fotos, notas, projetos, senha e configurações deste simulador? Esta ação não pode ser desfeita.'))return;let oldModel=state.model,owned=state.owned;state=initialState();state.model=oldModel;state.owned=owned;save();applyTheme();renderHome();closeApp();notify('Dados locais redefinidos.')}
function exportBackup(){let data={...state,photos:state.photos.map(p=>({...p,blobRef:undefined}))};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='star-phone-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);notify('Backup de dados exportado. Fotos não são incluídas no JSON.')}
function importBackup(){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{let f=input.files?.[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!data.model||!Array.isArray(data.apps))throw Error();if(!confirm('Substituir os dados atuais pelos dados do backup?'))return;state={...initialState(),...data,photos:state.photos};await save();applyTheme();renderHome();closeApp();notify('Backup importado.')}catch{notify('Arquivo de backup inválido.')}};input.click()}
function clearCache(){if(!confirm('Limpar 10 MB de cache simulado?'))return;state.cacheClearedAt=Date.now();notify('Cache simulado limpo.');renderFiles()}
function canInstall(item){if(item.ram>model().ram)return `Precisa de ${item.ram} GB de RAM`;if(item.cpu>model().cpu)return 'Processador virtual insuficiente';if(freeStorage()<item.size)return 'Armazenamento insuficiente';if(item.price>state.coins)return 'Moedas insuficientes';return ''}
function renderStore(){let b=$('appBody');b.innerHTML=`<div class="card" style="background:linear-gradient(135deg,#6b5ce7,#a88af7);color:white"><div class="muted" style="color:#ffffffb8">STAR STORE</div><div style="font-size:27px;font-weight:800;margin:7px 0">Seu próximo celular</div><div>Saldo: 🪙 <strong>${state.coins.toLocaleString('pt-BR')}</strong></div><div class="muted" style="color:#ffffffc4;margin-top:8px">Aparelho atual: ${model().name}</div></div><div class="title" style="margin:16px 3px">Celulares</div>${MODELS.map(m=>{let owned=state.owned.includes(m.id),current=m.id===state.model;return `<div class="card"><div class="row"><div class="miniicon" style="width:58px;height:70px;font-size:30px;border-radius:16px">📱</div><div style="flex:1"><div class="title" style="margin:0">${m.name}</div><div class="muted">${m.storage>=1024?m.storage/1024+' TB':m.storage+' GB'} · ${m.ram} GB RAM · ${m.battery.toLocaleString()} mAh</div><div class="muted">${m.mp} MP · ${m.charge} W · CPU ${m.cpu}/8</div><strong style="display:block;margin-top:6px">🪙 ${m.price.toLocaleString('pt-BR')}</strong></div></div><p class="small">${m.desc}</p>${current?'<button class="btn secondary full" disabled>Em uso</button>':owned?`<button class="btn full" onclick="equipModel('${m.id}')">Usar este celular</button>`:`<button class="btn full" onclick="buyModel('${m.id}')">Comprar</button>`}</div>`}).join('')}<div class="card"><div class="title">Aplicativos e jogos</div><div class="muted">Instale apps com moedas virtuais e confira os requisitos do seu aparelho.</div><button class="btn full" style="margin-top:10px" onclick="openApp('appmarket')">Abrir loja de apps</button></div>`}

function installApp(id){let a=APP_STORE.find(x=>x.id===id);if(!a)return;let reason=canInstall(a);if(reason){notify(reason);return}if(a.price>state.coins)return;let button=$('appBody').querySelector(`button[onclick="installApp('${id}')"]`);if(button){button.disabled=true;button.textContent='Instalando…'}setTimeout(()=>{if(freeStorage()<a.size||a.price>state.coins){notify('A instalação falhou.');renderAppMarket();return}state.coins-=a.price;state.balance=state.coins;state.transactions.unshift({id:Date.now(),type:'Compra de aplicativo',amount:-a.price,date:Date.now(),note:a.name});let installed=state.apps.find(x=>x.id===id);if(installed)installed.installed=true;else state.apps.push({...a,installed:true,kind:'download'});save();renderHome();renderAppMarket();notify(a.name+' instalado!')},Math.max(500,1200/model().cpu))}

function renderRace(){let b=$('appBody');b.innerHTML=`<div class="card"><div class="title">🏎️ Star Racer</div><div class="muted">Toque na esquerda ou direita para desviar. Quanto mais rápido o celular, mais suave a animação.</div><canvas id="raceCanvas" class="gamecanvas" width="320" height="430"></canvas><div class="row" style="margin-top:10px"><button class="btn secondary" onclick="moveRace(-1)">← Esquerda</button><strong id="raceScore">Pontos: 0</strong><button class="btn secondary" onclick="moveRace(1)">Direita →</button></div><button class="btn full" style="margin-top:10px" onclick="startRace()">Começar / reiniciar</button></div>`;let c=$('raceCanvas'),ctx=c.getContext('2d');ctx.fillStyle='#23233b';ctx.fillRect(0,0,320,430);ctx.fillStyle='#fff';ctx.font='16px sans-serif';ctx.textAlign='center';ctx.fillText('Toque em Começar',160,210)}
let race={running:false,lane:1,score:0,obstacles:[],last:0};
function moveRace(d){race.lane=Math.max(0,Math.min(2,race.lane+d))}
function startRace(){if(gameLoop)cancelAnimationFrame(gameLoop);race={running:true,lane:1,score:0,obstacles:[],last:0};function frame(t){if(activeApp!=='race'||!race.running)return;let c=$('raceCanvas'),ctx=c.getContext('2d');if(!race.last)race.last=t;let dt=Math.min(40,t-race.last);race.last=t;if(Math.random()<.025*model().cpu)race.obstacles.push({lane:Math.floor(Math.random()*3),y:-30});race.obstacles.forEach(o=>o.y+=dt*.13*model().cpu);race.obstacles=race.obstacles.filter(o=>o.y<460);for(let o of race.obstacles){if(o.lane===race.lane&&o.y>340&&o.y<400){race.running=false;notify('Fim de jogo! Pontos: '+race.score);return}}race.score+=Math.floor(dt/50);ctx.fillStyle='#23233b';ctx.fillRect(0,0,320,430);ctx.strokeStyle='#aaa';ctx.setLineDash([15,12]);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(106,0);ctx.lineTo(106,430);ctx.moveTo(213,0);ctx.lineTo(213,430);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ffb84d';for(let o of race.obstacles)ctx.fillRect(20+o.lane*100,o.y,65,28);ctx.fillStyle='#5de0bb';ctx.fillRect(25+race.lane*100,360,55,45);$('raceScore').textContent='Pontos: '+race.score;gameLoop=requestAnimationFrame(frame)}gameLoop=requestAnimationFrame(frame)}
function renderMemory(){let cards=['🍎','🚀','🐱','⭐','🎧','🌈','🍎','🚀','🐱','⭐','🎧','🌈'].sort(()=>Math.random()-.5),open=[],matched=[];let b=$('appBody');b.innerHTML=`<div class="card"><div class="title">🃏 Memória Mágica</div><div class="muted">Encontre os seis pares.</div><div id="memoryGrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px"></div><div id="memoryStatus" class="muted" style="margin-top:12px">Pares encontrados: 0/6</div><button class="btn secondary full" style="margin-top:10px" onclick="renderMemory()">Novo jogo</button></div>`;let grid=$('memoryGrid');cards.forEach((v,i)=>{let btn=document.createElement('button');btn.textContent='?';btn.style.cssText='aspect-ratio:1;border-radius:13px;background:#e8e4fc;font-size:24px';btn.onclick=()=>{if(open.length===2||matched.includes(i)||open.includes(i))return;open.push(i);btn.textContent=v;btn.style.background='#fff';if(open.length===2){let [a,c]=open;if(cards[a]===cards[c]){matched.push(a,c);open=[];$('memoryStatus').textContent=`Pares encontrados: ${matched.length/2}/6`;if(matched.length===12){notify('Você venceu!');earnCoins(20,'Vitória em jogo','Memória Mágica')}}else setTimeout(()=>{for(let n of open){let el=grid.children[n];if(el&&!matched.includes(n)){el.textContent='?';el.style.background='#e8e4fc'}}open=[]},700)}};grid.appendChild(btn)})}
function renderQuiz(){let qs=[['Quanto é 9 × 6?',['42','54','64'],1],['Qual é o maior oceano?',['Atlântico','Índico','Pacífico'],2],['Quantos lados tem um hexágono?',['5','6','8'],1],['Qual é a capital do Brasil?',['Brasília','São Paulo','Rio de Janeiro'],0]],score=0,index=0;b=$('appBody');b.innerHTML=`<div class="card"><div class="title">🧠 Quiz Star</div><div id="quizArea"></div></div>`;function next(){let area=$('quizArea');if(index>=qs.length){area.innerHTML=`<div class="title">Fim! Pontuação: ${score}/${qs.length}</div><button class="btn full" onclick="renderQuiz()">Jogar novamente</button>`;if(score>=3){earnCoins(20,'Quiz Star','Resultado '+score+'/'+qs.length);notify('+20 moedas!')}return}let q=qs[index];area.innerHTML=`<p>${index+1}/${qs.length} · ${q[0]}</p>${q[1].map((a,i)=>`<button class="btn secondary full" style="margin:4px 0" onclick="answer(${i})">${a}</button>`).join('')}`};window.answer=i=>{if(i===qs[index][2])score++;index++;next()};next()}

function calcPress(k){let d=$('calcDisplay');if(!d)return;if(k==='C'){calcExpr='';d.value='0';return}if(k==='⌫'){calcExpr=calcExpr.slice(0,-1);d.value=calcExpr||'0';return}if(k==='='){try{let e=calcExpr.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/%/g,'/100');if(!/^[0-9+\-*/().\s]+$/.test(e))throw Error();let result=Function('"use strict";return ('+e+')')();if(!Number.isFinite(result))throw Error();calcExpr=String(Math.round(result*1e8)/1e8);d.value=calcExpr}catch{d.value='Erro';calcExpr=''}return}calcExpr+=k;d.value=calcExpr}

let timerId=null,swId=null,swBase=0,swRunning=false;
function startTimer(){stopTimer();let sec=Math.max(1,Math.min(180,Number($('timerMinutes').value)||1))*60,end=Date.now()+sec*1000;$('timerLabel').textContent='Restam '+sec+' s';timerId=setInterval(()=>{let left=Math.max(0,Math.ceil((end-Date.now())/1000));if($('timerLabel'))$('timerLabel').textContent=`Restam ${left} s`;if(!left){stopTimer();notify('Temporizador finalizado!')}},250)}

function stopwatchToggle(){if(swRunning){swBase=Date.now()-swBase;swRunning=false;if(swId)clearInterval(swId)}else{swBase=Date.now()-swBase;swRunning=true;swId=setInterval(()=>{let e=Date.now()-swBase,el=$('stopwatch');if(el)el.textContent=String(Math.floor(e/60000)).padStart(2,'0')+':'+String(Math.floor(e/1000)%60).padStart(2,'0')+'.'+Math.floor(e%1000/100)},100)}}

function renderPhone(){$('appBody').innerHTML=`<div class="card"><div class="title">Telefone demonstrativo</div><input id="dialNumber" class="input" readonly placeholder="Digite um número" style="font-size:25px;text-align:center"><div class="keypad">${['1','2','3','4','5','6','7','8','9','*','0','#'].map(n=>`<button onclick="$('dialNumber').value+='${n}'">${n}</button>`).join('')}</div><button class="btn full" style="margin-top:10px" onclick="simulateCall()">📞 Simular chamada</button><div class="muted" style="margin-top:8px">Não realiza chamadas reais.</div><div class="title" style="margin-top:15px">Histórico</div>${(state.calls||[]).slice(0,10).map(c=>`<div class="listitem"><div class="miniicon">📞</div><div class="desc"><strong>${escapeHTML(c.number)}</strong><small>${new Date(c.date).toLocaleString('pt-BR')}</small></div></div>`).join('')}</div>`}
function simulateCall(){let n=$('dialNumber').value;if(!n){notify('Digite um número fictício.');return}state.calls.unshift({number:n,date:Date.now()});save();notify('Chamada fictícia encerrada.');renderPhone()}
function renderCalendar(){$('appBody').innerHTML=`<div class="card"><div class="title">Calendário e eventos</div><div style="font-size:20px;font-weight:750">${new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</div><div class="muted">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric'})}</div><label class="label">Novo evento</label><input id="eventTitle" class="input" placeholder="Nome do evento"><input id="eventDate" class="input" type="date" value="${new Date().toISOString().slice(0,10)}"><button class="btn full" onclick="addEvent()">Adicionar evento</button><div class="title" style="margin-top:15px">Seus eventos</div>${state.events.map((e,i)=>`<div class="listitem"><div class="miniicon">📅</div><div class="desc"><strong>${escapeHTML(e.title)}</strong><small>${e.date}</small></div><button class="btn danger" onclick="removeEvent(${i})">×</button></div>`).join('')}</div>`}
function addEvent(){let title=$('eventTitle').value.trim(),date=$('eventDate').value;if(!title||!date){notify('Informe nome e data.');return}state.events.push({title,date});save();renderCalendar()}
function removeEvent(i){state.events.splice(i,1);save();renderCalendar()}
function renderMusic(){$('appBody').innerHTML=`<div class="card"><div class="title">🎵 Música local</div><p class="small">Escolha um arquivo de áudio do aparelho. A reprodução depende do formato e das permissões do Safari.</p><input class="input" type="file" id="audioFile" accept="audio/*"><audio id="audioPlayer" controls style="width:100%;margin-top:10px"></audio><div class="muted">O arquivo não é enviado para nenhum servidor.</div></div>`;$('audioFile').onchange=()=>{let f=$('audioFile').files?.[0];if(f)$('audioPlayer').src=URL.createObjectURL(f)}}
function renderPaint(){$('appBody').innerHTML=`<div class="card"><div class="title">Star Paint</div><div class="muted">Desenhe com o dedo e salve a imagem na galeria.</div><input id="paintColor" type="color" value="#6757d9" style="width:100%;height:40px"><canvas id="paintCanvas" width="600" height="600" style="width:100%;background:white;border-radius:12px;touch-action:none"></canvas><div class="row" style="margin-top:10px"><button class="btn secondary" onclick="clearPaint()">Limpar</button><button class="btn" onclick="savePaint()">Salvar na galeria</button></div></div>`;let c=$('paintCanvas'),ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);let draw=false;function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}c.onpointerdown=e=>{draw=true;c.setPointerCapture(e.pointerId);let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};c.onpointermove=e=>{if(!draw)return;let p=pos(e);ctx.strokeStyle=$('paintColor').value;ctx.lineWidth=12;ctx.lineCap='round';ctx.lineTo(p.x,p.y);ctx.stroke()};c.onpointerup=()=>draw=false}
function clearPaint(){let c=$('paintCanvas'),x=c.getContext('2d');x.fillStyle='white';x.fillRect(0,0,c.width,c.height)}
async function savePaint(){let c=$('paintCanvas');let blob=await new Promise(r=>c.toBlob(r,'image/png'));if(!blob||freeStorage()<blob.size/1024){notify('Espaço insuficiente.');return}let id='p'+Date.now(),p={id,name:'StarPaint_'+Date.now()+'.png',date:Date.now(),sizeKB:blob.size/1024,favorite:false,mime:'image/png',blobRef:'photo:'+id};await dbSet(p.blobRef,blob);state.photos.unshift(p);save();notify('Desenho salvo na galeria.')}
function renderGeneric(id){if(id==='appmarket')return renderAppMarket();let a=state.apps.find(x=>x.id===id)||APP_STORE.find(x=>x.id===id);$('appBody').innerHTML=`<div class="card"><div class="title">${a?.icon||'📦'} ${escapeHTML(a?.name||id)}</div><p>Este aplicativo está instalado no Star Phone OS.</p><div class="muted">Versão inicial: funções avançadas deste aplicativo ainda não fazem parte do núcleo implementado.</div><button class="btn secondary full" onclick="openApp('settings')">Abrir configurações</button></div>`}
function openApp(id){if(id==='appmarket'){if(state.battery<=0){showCharging();return}activeApp=id;renderAppMarket();$('appTitle').textContent='Loja de aplicativos';$('appView').classList.add('show');return}let app=state.apps.find(a=>a.id===id);if(!app||!app.installed){if(APP_STORE.some(a=>a.id===id)){renderAppMarket();$('appTitle').textContent='Loja de aplicativos';$('appView').classList.add('show');activeApp='appmarket';return}notify('Este aplicativo não está instalado.');return}if(state.battery<=0){showCharging();return}if(state.locked){showLock();return}if(activeApp&&activeApp!==id){state.history.push(activeApp);if(state.history.length>10)state.history.shift()}activeApp=id;let delay=Math.max(100,800/model().cpu+(model().ram<4?300:0)+(freeStorage()<model().storage*100?200:0));renderApp(id,delay);save();updateStatus()}
function tick(){if(!state)return;let now=Date.now();if(state.charging){state.battery=Math.min(100,state.battery+chargeRate()/3600);if(state.battery>=100){state.charging=false;state.chargeStarted=null;notify('Bateria carregada!')}}else if(state.battery>0){state.battery=Math.max(0,state.battery-batteryDrain()/3600)}if(state.battery<=0){state.battery=0;state.locked=true;showCharging()}updateStatus();if($('chargePercent'))$('chargePercent').textContent=Math.floor(state.battery)+'%';if($('chargeBar'))$('chargeBar').style.width=state.battery+'%';if(now%5000<1000)save()}
document.addEventListener('visibilitychange',()=>{if(document.hidden){save()}else{updateStatus()}});
window.addEventListener('beforeunload',()=>{save()});
$('phone').addEventListener('touchstart',e=>{window._touchY=e.touches[0].clientY},{passive:true});
load().then(()=>{tickTimer=setInterval(tick,1000);});
</script>
</body>
</html>
